name: materialize-updater
# assemble scripts/lxc/update from restore-parts base64 chunks
on:
  push:
    paths:
      - '.github/restore-parts/**'
      - '.github/artifacts/update.gz.b64'
      - '.github/workflows/materialize-updater.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode full scripts/lxc/update
        run: |
          mkdir -p scripts/lxc
          python3 - <<'PY'
          import base64, gzip, pathlib, re
          parts_dir = pathlib.Path(".github/restore-parts")
          part_files = sorted(parts_dir.glob("upd_part_*.txt"), key=lambda p: int(p.stem.split("_")[-1]))
          if len(part_files) >= 9:
              b64 = "".join(p.read_text().strip() for p in part_files)
              data = base64.b64decode(b64)
              print("assembled from", len(part_files), "parts")
          else:
              raw = pathlib.Path(".github/artifacts/update.gz.b64").read_text()
              raw = re.sub(r"\s+", "", raw)
              data = gzip.decompress(base64.b64decode(raw))
              print("decoded from gzip artifact")
          assert b"self_update_from_app" in data, "missing self_update_from_app"
          assert b"restore-parts" in data, "missing restore-parts"
          head = b"\n".join(data.splitlines()[:3])
          assert b"Temporary bootstrap" not in head, "looks like Temporary bootstrap stub"
          pathlib.Path("scripts/lxc/update").write_bytes(data)
          pathlib.Path("scripts/lxc/update").chmod(0o755)
          print("wrote", len(data), "bytes")
          PY
      - name: Commit materialized updater
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Fix updater: ship full scripts/lxc/update (no self-overwrite stub)"
          file_pattern: scripts/lxc/update
