name: restore-client
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/.restore/client.ts.zb64.part*'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and decompress client.ts
        run: |
          python3 - <<'PY'
          import base64, zlib, pathlib
          parts = sorted(pathlib.Path('scripts/.restore').glob('client.ts.zb64.part*'))
          zb64 = ''.join(p.read_text().strip() for p in parts)
          data = zlib.decompress(base64.b64decode(zb64))
          out = pathlib.Path('src/lib/proxmox/client.ts')
          out.write_bytes(data)
          print('parts', [p.name for p in parts])
          print('wrote', len(data), 'bytes to', out)
          PY
      - name: Commit restored client.ts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/proxmox/client.ts
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "prod: SSE cluster stream + proxmox auth/client hardening"
          git push
