name: restore-client
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/.restore/client.ts.zb64'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decompress client.ts
        run: |
          python3 - <<'PY'
          import base64, zlib, pathlib
          raw = pathlib.Path('scripts/.restore/client.ts.zb64').read_text().strip()
          data = zlib.decompress(base64.b64decode(raw))
          pathlib.Path('src/lib/proxmox/client.ts').write_bytes(data)
          print('wrote', len(data), 'bytes')
          PY
      - name: Commit restored client.ts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/proxmox/client.ts
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "prod: SSE cluster stream + proxmox auth/client hardening"
          git push
