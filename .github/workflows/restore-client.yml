name: restore-blobs
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/.restore/**'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble compressed blobs
        run: |
          python3 - <<'PY'
          import base64, zlib, pathlib, re, hashlib
          root = pathlib.Path('scripts/.restore')
          groups = {}
          for p in sorted(root.glob('*.zb64.part*')):
              m = re.match(r'(.+)\.zb64\.part(\d+)$', p.name)
              if not m:
                  print('no-match', p.name)
                  continue
              groups.setdefault(m.group(1), []).append((int(m.group(2)), p))
              print('match', p.name, m.group(1), m.group(2))
          MAP = {
            'client.ts': 'src/lib/proxmox/client.ts',
            'src__components__dashboard.tsx': 'src/components/dashboard.tsx',
            'src__components__servers-setup.tsx': 'src/components/servers-setup.tsx',
            'scripts__lxc__install-voxmox.sh': 'scripts/lxc/install-voxmox.sh',
            'scripts__voxmox-lxc.sh': 'scripts/voxmox-lxc.sh',
            'package-lock.json': 'package-lock.json',
          }
          changed = []
          for safe, parts in sorted(groups.items()):
              parts = [p for _, p in sorted(parts)]
              dest = MAP.get(safe)
              print('group', safe, 'parts', len(parts), 'dest', dest)
              if not dest:
                  print('skip unknown', safe)
                  continue
              zb64 = ''.join(p.read_text().strip() for p in parts)
              print('zb64-len', len(zb64))
              data = zlib.decompress(base64.b64decode(zb64))
              out = pathlib.Path(dest)
              out.parent.mkdir(parents=True, exist_ok=True)
              prev = out.read_bytes() if out.exists() else b''
              print('dest', dest, 'prev', len(prev), hashlib.sha256(prev).hexdigest()[:12], 'new', len(data), hashlib.sha256(data).hexdigest()[:12], 'same', prev == data)
              out.write_bytes(data)
              if prev != data:
                  changed.append(dest)
                  print('wrote', dest)
              else:
                  print('unchanged', dest)
          pathlib.Path('changed.txt').write_text('\n'.join(changed) + ('\n' if changed else ''))
          print('changed_count', len(changed), changed)
          PY
      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "changed.txt:"; cat -A changed.txt || true
          if [ ! -s changed.txt ]; then echo "No changes"; exit 0; fi
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "adding $f"
            git add -- "$f"
          done < changed.txt
          git status
          git diff --cached --stat
          git diff --cached --quiet && echo "No staged changes" && exit 0
          if grep -qx 'package-lock.json' changed.txt && [ "$(grep -c . changed.txt)" -eq 1 ]; then
            msg="prod: refresh package-lock.json"
          elif grep -qE 'dashboard|servers-setup|lxc' changed.txt; then
            msg="prod: dashboard SSE client + LXC scripts"
          else
            msg="prod: SSE cluster stream + proxmox auth/client hardening"
          fi
          git commit -m "$msg"
          git push
